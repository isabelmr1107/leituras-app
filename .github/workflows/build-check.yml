name: Verificar compilação do LIO
on:
  push:
    branches: [main, feature/estante-visual-capas]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Verificar build sem credenciais reais
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AUTH_SECRET: ci-only-non-production-placeholder-do-not-reuse
        run: npm run build
